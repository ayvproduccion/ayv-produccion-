<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Primavera - Versículo Bíblico</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: Georgia, serif;
    background: linear-gradient(
        135deg,
        #fffde7,
        #fff9c4,
        #f1f8e9,
        #ffffff
    );
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Fondo luminoso */
.fondo {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,235,59,.35), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(255,193,7,.25), transparent 30%);
}

/* Texto principal */
.contenido {
    position: relative;
    z-index: 5;
    width: 80%;
    max-width: 850px;
    text-align: center;
    padding: 50px 35px;
    border-radius: 30px;
    background: rgba(255,255,255,.72);
    box-shadow: 0 15px 50px rgba(100,80,20,.15);
    backdrop-filter: blur(6px);
}

h1 {
    font-size: clamp(38px, 7vw, 72px);
    color: #d89b00;
    margin-bottom: 25px;
    text-shadow: 2px 3px 5px rgba(120,80,0,.18);
}

.versiculo {
    font-size: clamp(22px, 3.5vw, 38px);
    line-height: 1.5;
    color: #4e5b35;
    font-style: italic;
}

.referencia {
    margin-top: 22px;
    font-size: clamp(18px, 2.5vw, 28px);
    font-weight: bold;
    color: #b77b00;
}

/* Flores */
.flor {
    position: absolute;
    font-size: 70px;
    z-index: 2;
    animation: flotar 5s ease-in-out infinite;
    filter: drop-shadow(0 5px 5px rgba(100,70,0,.15));
}

.f1 { top: 5%; left: 7%; animation-delay: 0s; }
.f2 { top: 12%; right: 8%; animation-delay: 1s; }
.f3 { bottom: 8%; left: 10%; animation-delay: 2s; }
.f4 { bottom: 5%; right: 9%; animation-delay: 3s; }
.f5 { top: 45%; left: 2%; font-size: 50px; animation-delay: 1.5s; }
.f6 { top: 48%; right: 2%; font-size: 50px; animation-delay: 2.5s; }

@keyframes flotar {
    0%, 100% {
        transform: translateY(0) rotate(-4deg);
    }
    50% {
        transform: translateY(-15px) rotate(5deg);
    }
}

/* Pétalos */
.petalo {
    position: absolute;
    top: -30px;
    color: #ffd21c;
    font-size: 25px;
    animation: caer linear infinite;
}

.p1 { left: 15%; animation-duration: 8s; }
.p2 { left: 35%; animation-duration: 11s; animation-delay: 2s; }
.p3 { left: 55%; animation-duration: 9s; animation-delay: 4s; }
.p4 { left: 75%; animation-duration: 12s; animation-delay: 1s; }
.p5 { left: 90%; animation-duration: 10s; animation-delay: 3s; }

@keyframes caer {
    0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 0;
    }
    15% {
        opacity: 1;
    }
    100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="fondo"></div>

<!-- Flores amarillas -->
<div class="flor f1">🌻</div>
<div class="flor f2">🌼</div>
<div class="flor f3">🌻</div>
<div class="flor f4">🌼</div>
<div class="flor f5">🌼</div>
<div class="flor f6">🌻</div>

<!-- Pétalos cayendo -->
<div class="petalo p1">🌼</div>
<div class="petalo p2">🌼</div>
<div class="petalo p3">🌼</div>
<div class="petalo p4">🌼</div>
<div class="petalo p5">🌼</div>

<!-- Mensaje -->
<div class="contenido">

    <h1>🌼 Feliz Primavera 🌼</h1>

    <div class="versiculo">
        “Todo tiene su tiempo, y todo lo que se quiere
        debajo del cielo tiene su hora.”
    </div>

    <div class="referencia">
        Eclesiastés 3:1
    </div>

</div>

</body>
</html>
